plugins { id 'com.android.application' }

android {
    namespace 'com.ornek.yallasesh'
    compileSdk 34
    defaultConfig {
        applicationId "com.ornek.yallasesh"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.jitsi.react:jitsi-meet-sdk:8.3.0'
}
